# Smart Campus version catalog: the ONLY place where dependency and plugin versions live.
# Checked on 2026-11-20 against official sources (task T1.1):
#
# spring-boot 4.1.3
#   https://repo1.maven.org/maven2/org/springframework/boot/spring-boot/maven-metadata.xml
#   Why 4.1.x and not 4.2.0 (GA 2026-11-19): springdoc has no Boot 4.2 line yet.
#   springdoc's matrix lists Boot 4.1.x -> 3.1.x-3.2.x: https://springdoc.org/#what-is-the-compatibility-matrix-of-springdoc-openapi-with-spring-boot
#   Move to 4.2 when springdoc lists it.
# spring-cloud 2025.1.5 (Oakwood): "2025.1.x -> Boot 4.0.x, 4.1.x (starting with 2025.1.2)"
#   https://spring.io/projects/spring-cloud (Release Train / Spring Boot Generation table)
# spring-modulith 2.1.3: spring-modulith-starter-core 2.1.3 is built on spring-boot-starter 4.1.3
#   https://repo1.maven.org/maven2/org/springframework/modulith/spring-modulith-starter-core/2.1.3/spring-modulith-starter-core-2.1.3.pom
# springdoc 3.2.0: built on spring-boot-starter-parent 4.1.2, listed for Boot 4.1.x
#   https://springdoc.org/#what-is-the-compatibility-matrix-of-springdoc-openapi-with-spring-boot
# testcontainers 2.0.5: managed by the Boot 4.1.3 BOM (<testcontainers.version>), so no entry here
#   https://repo1.maven.org/maven2/org/springframework/boot/spring-boot-dependencies/4.1.3/spring-boot-dependencies-4.1.3.pom
# archunit 1.5.1
#   https://repo1.maven.org/maven2/com/tngtech/archunit/archunit/maven-metadata.xml
# spotless (Gradle plugin) 8.11.0
#   https://repo1.maven.org/maven2/com/diffplug/spotless/spotless-plugin-gradle/maven-metadata.xml
# palantir-java-format 2.103.0
#   https://repo1.maven.org/maven2/com/palantir/javaformat/palantir-java-format/maven-metadata.xml
# spring-dependency-management (Gradle plugin) 1.1.7
#   https://repo1.maven.org/maven2/io/spring/gradle/dependency-management-plugin/maven-metadata.xml
# Gradle 9.9.2 (pinned in gradle/wrapper/gradle-wrapper.properties, with its SHA-256)
#   https://services.gradle.org/versions/current
#   Boot 4.1 supports "Gradle 8.x (8.14 or later) and 9.x": https://docs.spring.io/spring-boot/4.1/system-requirements.html

[versions]
java = "21"
spring-boot = "4.1.3"
spring-cloud = "2025.1.5"
spring-modulith = "2.1.3"
springdoc = "3.2.0"
archunit = "1.5.1"
spotless = "8.11.0"
palantir-java-format = "2.103.0"
spring-dependency-management = "1.1.7"

[libraries]
# BOMs, imported with platform(...)
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
# Libraries the Boot BOM does not manage
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
springdoc-webflux-ui = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
