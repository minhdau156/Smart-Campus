# Local infrastructure for Smart Campus.
#   First time:  cp infra/.env.example infra/.env
#   Start:       docker compose -f infra/docker-compose.yml up -d --wait   (waits until all are healthy)
#   Stop:        docker compose -f infra/docker-compose.yml down
#   Wipe data:   docker compose -f infra/docker-compose.yml down -v
#
# Every image tag is pinned (no "latest"). Ports listen on 127.0.0.1 only (this computer).
# Later tasks add profiles: "apps" (the 4 backend apps, T15) and "observability" (T16-T18).
name: smart-campus

services:
  postgres:
    image: postgres:19.0-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy infra/.env.example to infra/.env}
      POSTGRES_USER: ${POSTGRES_USER:?copy infra/.env.example to infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy infra/.env.example to infra/.env}
      # Read by init/01-schemas-and-users.sh on first start
      CORE_APP_DB_PASSWORD: ${CORE_APP_DB_PASSWORD:?set in infra/.env}
      REGISTRATION_SVC_DB_PASSWORD: ${REGISTRATION_SVC_DB_PASSWORD:?set in infra/.env}
      NOTIFICATION_SVC_DB_PASSWORD: ${NOTIFICATION_SVC_DB_PASSWORD:?set in infra/.env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in infra/.env}
    ports:
      # computer port 5433 -> container port 5432. Not 5432 on the computer, so it does not clash
      # with another Postgres there. Inside Compose, other containers still use postgres:5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.8.4-alpine3.23
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    # Single broker in KRaft mode (no ZooKeeper): this one node is both broker and controller.
    image: apache/kafka:4.4.0
    environment:
      CLUSTER_ID: U21hcnRDYW1wdXNEZXYxMQ   # base64 of the 16 bytes "SmartCampusDev11"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Two client listeners: EXTERNAL for apps on this computer (localhost:9092),
      # INTERNAL for containers in this Compose network (kafka:29092).
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # One broker, so internal topics can only have 1 copy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by the apps on purpose (spec T12), never by a typo.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Dev disk cap: at most ~100 MB kept per partition (event topics keep data forever by time,
      # retention.ms=-1, so this size cap is what protects the dev disk).
      KAFKA_LOG_RETENTION_BYTES: 104857600
      KAFKA_LOG_SEGMENT_BYTES: 16777216
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  keycloak:
    # Empty for now: realm and roles come in the "identity" module.
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in infra/.env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set in infra/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in infra/.env}
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl, so ask the health endpoint (management port 9000) with plain bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  opensearch:
    image: opensearchproject/opensearch:3.10.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  rustfs:
    # S3-compatible file store, replaces MinIO (spec Q6).
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set in infra/.env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set in infra/.env}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health/ready > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    # Fake mail server: apps send mail to smtp://localhost:1025, you read it at http://localhost:8025.
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  kafka-data:
  opensearch-data:
  rustfs-data:
